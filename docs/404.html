<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Rienk Speelman</title>
  <meta name="robots" content="noindex">
  <!-- Netlify serves this automatically for anything that isn't there, and
       _redirects points the working files here too. Deliberately standalone:
       no content.js, no site.js — a page that says "not found" must not be
       able to fail for the same reason the visitor arrived. -->
  <style>
    @font-face {
      font-family: "Bebas Neue";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/bebasneue-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/spacemono-400-latin.woff2") format("woff2");
    }
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #0a0000;
      color: #f5f5f5;
      font-family: "Space Mono", "Courier New", monospace;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-family: "Bebas Neue", "Arial Narrow", sans-serif;
      font-weight: 400;
      font-size: clamp(3.5rem, 14vw, 7rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
    }
    p { margin: 0 0 2rem; color: rgba(245, 245, 245, 0.62); }
    a {
      display: inline-block;
      padding: 0.85em 1.9em;
      border: 1.5px solid transparent;
      border-radius: 999px;
      background: #edf07b;
      color: #060000;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: background-color 0.9s cubic-bezier(0.6, 0, 0.3, 1),
                  border-color 0.9s cubic-bezier(0.6, 0, 0.3, 1),
                  color 0.9s cubic-bezier(0.6, 0, 0.3, 1);
    }
    @media (hover: hover) and (pointer: fine) {
      a:hover {
        background: transparent;
        border-color: #edf07b;
        border-style: dotted;
        color: #edf07b;
        transition-duration: 0.35s;
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page isn&rsquo;t here.</p>
    <a href="/">Back to the work</a>
  </main>
</body>
</html>
