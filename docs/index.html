<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIENK SPEELMAN — Music for Commercials, Trailers &amp; Games</title>
  <meta name="description" content="Rienk Speelman — producer, songwriter and vocalist for commercials, trailers, television and games. From a 30-second jingle to a full score, vocals included.">
  <!-- SHARE PREVIEW (Slack, WhatsApp, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rienk Speelman">
  <meta property="og:title" content="RIENK SPEELMAN — Music for Commercials, Trailers &amp; Games">
  <meta property="og:description" content="Producer, songwriter and vocalist for commercials, trailers, television and games. Hear the work and get in touch.">
  <meta property="og:url" content="https://rienkspeelman.nl/">
  <!-- absolute on purpose: a link scraper does not resolve relative paths, so
       "og.jpg" would unfurl with no picture at all. If the domain ever changes,
       these three lines change with it — og:url, og:image and twitter:image. -->
  <meta property="og:image" content="https://rienkspeelman.nl/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="RIENK SPEELMAN in large white letters on near-black, above the line Music for Commercials, Trailers &amp; Games">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rienkspeelman.nl/og.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- the video cards' thumbnails all come from this one host — opening the
       connection early saves about three round-trips before the first
       picture paints. It is a handshake, not a request: nothing is fetched
       from here until a card actually asks for its thumbnail. -->
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* If content.js has a typo, the browser knows which line it choked on —
       but by the time site.js notices the content is missing, that message
       is gone. Stash it here (capture phase, before content.js loads) so the
       friendly error screen can point at the line. */
    window.addEventListener("error", function (e) {
      /* a missing picture fires here too, and carries no message — skip those */
      if (window.CONTENT_LOAD_ERROR || !e || !e.message) return;
      if (e.filename && e.filename.indexOf("content.js") === -1) return;
      window.CONTENT_LOAD_ERROR = { line: e.lineno, message: e.message };
    }, true);
  </script>
</head>
<body>

  <a class="skip-link" href="#work">Skip to content</a>

  <!-- near the top on purpose: with JavaScript off there is no page to put
       this after, and at the bottom it was never read. It sits just below the
       skip link so that stays the first tab stop; the header is fixed, so
       this still paints above everything. -->
  <noscript>
    <div class="noscript-note">
      <p>This site builds itself in the browser, so with JavaScript switched off
      there is nothing here to see — no work, no players, not even the contact
      details. Sorry about that.</p>
      <p>Rienk Speelman writes music for commercials, trailers, television and
      games. You can hear the work and reach him on
      <a href="https://open.spotify.com/artist/1EDTEfdQZ9nRsyZjfRNEfo">Spotify</a>
      or <a href="https://instagram.com/rienk.music">Instagram</a>.</p>
    </div>
  </noscript>

  <header class="site-header">
    <nav class="header-nav" aria-label="Main">
      <a href="#work">WORK</a>
      <a href="#music" data-slot="music-link">MUSIC</a>
      <a href="#studio" data-slot="studio-link">STUDIO</a>
      <a href="#about">ABOUT</a>
    </nav>
    <a class="header-name" href="#top" data-content="name">RIENK SPEELMAN</a>
    <div class="header-actions">
      <div class="header-socials" data-slot="header-socials"></div>
      <a class="pill-button header-contact" href="#contact">CONTACT</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <span class="menu-toggle-bar"></span>
        <span class="menu-toggle-bar"></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <nav aria-label="Mobile" data-slot="mobile-nav">
      <!-- section links are generated here -->
    </nav>
    <div class="mobile-menu-socials" data-slot="mobile-socials"></div>
  </div>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <h1 class="hero-name" data-content="name">RIENK SPEELMAN</h1>
      <div class="hero-sub">
        <p class="hero-tagline" data-content="tagline"></p>
        <ul class="hero-categories" data-slot="categories"></ul>
      </div>
    </section>

    <!-- WORK SECTIONS (generated from content.js) -->
    <div id="work" data-slot="sections"></div>

    <!-- MUSIC (own releases, generated from content.js) -->
    <div data-slot="music"></div>

    <!-- STUDIO (local video, generated from content.js) -->
    <div data-slot="studio"></div>

    <!-- ABOUT -->
    <section class="section section-about" id="about">
      <div class="about-body">
        <div class="about-intro">
          <h2 class="giant-label about-heading reveal">I&rsquo;M <span data-content="firstname">RIENK</span></h2>
          <p class="about-text reveal" data-content="about"></p>
        </div>
        <div class="about-photo reveal" data-slot="about-photo" hidden></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section section-contact" id="contact">
      <!-- the space before the break is real text: without it the heading
           reads "GET INTOUCH" to crawlers, copy-paste and screen readers -->
      <h2 class="giant-label reveal">GET IN <br>TOUCH</h2>
      <div class="contact-actions reveal">
        <a class="pill-button pill-button-big" data-slot="contact-button" href="#">CONTACT</a>
        <div class="contact-socials" data-slot="contact-socials"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p><span data-content="copyright">©</span></p>
  </footer>

  <script src="content.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
